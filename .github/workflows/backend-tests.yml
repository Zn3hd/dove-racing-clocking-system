name: Backend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dove_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: dove_racing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dove_test -d dove_racing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://dove_test:local_ci_only@localhost:5432/dove_racing_test
      TEST_DATABASE_URL: postgresql+psycopg://dove_test:local_ci_only@localhost:5432/dove_racing_test
      JWT_SECRET_KEY: ci-only-test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ../gateway
      - name: Apply real PostgreSQL schema and seed
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"].replace("postgresql+psycopg://","postgresql://")) as conn:
              conn.execute(Path("sql/001_schema.sql").read_text())
              conn.execute(Path("sql/002_seed.sql").read_text())
              conn.execute(Path("sql/003_finalization_guards.sql").read_text())
              conn.execute(Path("sql/004_guest_official_verification.sql").read_text())
              conn.execute(Path("sql/005_device_gateway.sql").read_text())
              conn.execute(Path("sql/006_multichannel_clocking.sql").read_text())
              conn.execute(Path("sql/007_messenger_links.sql").read_text())
              conn.execute(Path("sql/008_clubs.sql").read_text())
              conn.execute(Path("sql/009_reader_adapters.sql").read_text())
              conn.execute(Path("sql/010_clocking_validation.sql").read_text())
              conn.execute(Path("sql/011_loft_gps.sql").read_text())
              conn.execute(Path("sql/012_loft_address.sql").read_text())
              conn.execute(Path("sql/013_rate_limits.sql").read_text())
              conn.execute(Path("sql/014_reader_monitoring.sql").read_text())
          PY
      - name: Compile Python source (catch syntax errors)
        run: python -m compileall -q app tests
      - name: Run unit, API, and PostgreSQL integration tests
        run: python -m pytest -v --tb=short --junitxml=pytest-results.xml
      - name: Upload test report (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml
          if-no-files-found: warn
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
  qr-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pigeon_qr_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: pigeon_qr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigeon_qr_test -d pigeon_qr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      QR_AUDIT_DATABASE_URL: postgresql+psycopg://pigeon_qr_test:local_ci_only@127.0.0.1:5432/pigeon_qr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qr-core.test.cjs
      - run: python -m pip install -r requirements.txt -r requirements-browser-test.txt -e ../gateway
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q browser_tests/qr_browser.py browser_tests/qr_live.py --basetemp=.pytest-tmp-qr-browser
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run --project-dir firmware/esp32
