name: Flutter web preview

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web scaffold
        run: flutter create --project-name dove_racing_mobile --platforms web .
      - name: Remove generated template widget test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build read-only web demo
        run: flutter build web --release --dart-define=WEB_PREVIEW=true
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dove-racing-web-preview
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Publish PR preview to Cloudflare Pages
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PAGES_PROJECT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials not configured; web build artifact is available."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy build/web \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER"
