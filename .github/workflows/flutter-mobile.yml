name: Flutter mobile checks

on:
  push:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name dove_racing_mobile --platforms android .
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Configure pilot app network and backup policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          root = ET.parse(path)
          ET.SubElement(root.getroot(), 'uses-permission', {f'{{{ns}}}name': 'android.permission.INTERNET'})
          app = root.getroot().find('application')
          app.set(f'{{{ns}}}allowBackup', 'false')
          app.set(f'{{{ns}}}usesCleartextTraffic', 'false')
          root.write(path, encoding='utf-8', xml_declaration=True)
          PY
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Verify Android debug build
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dove-racing-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  mobile-backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pigeon_qr_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: pigeon_qr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigeon_qr_test -d pigeon_qr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      QR_AUDIT_DATABASE_URL: postgresql+psycopg://pigeon_qr_test:local_ci_only@127.0.0.1:5432/pigeon_qr_test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
        working-directory: mobile
      - run: python -m pip install -r requirements.txt -r requirements-browser-test.txt
        working-directory: backend
      - name: Verify mobile queue and actual backend replay protection
        run: python -m pytest -q browser_tests/mobile_live.py --basetemp=.pytest-tmp-mobile-live
        working-directory: backend
