[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-rfid-gateway"
version = "0.1.0"
description = "Cross-platform, locally buffered RFID evidence gateway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
hid = ["hidapi>=0.14,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
pigeon-gateway = "pigeon_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pigeon_gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
